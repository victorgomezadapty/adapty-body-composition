[project]
name = "adapty-inbody-intelligence-system"
version = "0.1.0"
description = "FastAPI and Streamlit MVP for InBody-style body composition tracking."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Victor Gomez" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

